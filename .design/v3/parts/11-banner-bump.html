<article class="banner banner--graphite" data-reveal="up" style="--i:1">
  <div class="banner__head">
    <h3 class="banner__label"><span class="ico-sq"><svg class="ico"><use href="#i-bump"/></svg></span>Order bump</h3>
    <a class="banner__go" href="/upsell-e-order-bump#como-funciona-o-order-bump-no-snapp" aria-label="Conhecer o order bump"></a>
  </div>
  <p class="banner__text">Ofertas extras na tela de pagamento. O cliente marca e paga tudo junto.</p>
  <div class="banner__media" role="img" aria-label="Checkout no celular com dois order bumps: o Guia Rápido, de mais US$ 7, foi marcado e o botão de pagar passou de US$ 27 para US$ 34.">
    <div class="bp">
      <div class="bp__phone dev-phone mk">
        <div class="dev-phone__screen">
          <div class="ck">
            <div class="ck__product"><span class="ck__thumb"><svg class="ico"><use href="#i-play-screen"/></svg></span><span class="ck__name">Planner Digital</span><span class="ck__price">US$ 27</span></div>
            <div class="ck__bump is-on bp__bump">
              <span class="ck__box"><svg class="ico"><use href="#i-check"/></svg></span>
              <span class="bp__thumb"><svg class="ico" viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h3.5"/></svg></span>
              <span class="bp__txt"><b>Guia Rápido</b><span><b>+US$ 7</b></span></span>
              <i class="bp__tap"></i><b class="bp__fly">+US$ 7</b>
            </div>
            <div class="ck__bump">
              <span class="ck__box"><svg class="ico"><use href="#i-check"/></svg></span>
              <span class="bp__thumb"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/></svg></span>
              <span class="bp__txt"><b>Planilha de Metas</b><span><b>+US$ 5</b></span></span>
            </div>
            <span class="ck__cta bp__cta">Pagar <span class="bp__sum"><i class="bp__old">US$ 27</i><i class="bp__new">US$ 34</i></span></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</article>
